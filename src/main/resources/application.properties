spring.application.name=VitaFortis

server.port=${PORT:5001}
vita-fortis.tomcat.nio2=${TOMCAT_NIO2:true}

# Jackson
spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false

# DataSource - MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vitafortis?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_general_ci&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USERNAME:VF}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Hikari
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logs SQL
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Migrações desativadas por enquanto
spring.flyway.enabled=false
spring.liquibase.enabled=false

# Catalogo FTW: importacao idempotente de produtos como rascunhos inativos.
vita-fortis.catalogo-ftw.importar=${IMPORTAR_CATALOGO_FTW:true}

# Recuperacao de senha. Habilite o envio somente depois de configurar um SMTP real.
vita-fortis.email.enabled=${EMAIL_ENABLED:false}
vita-fortis.email.from=${EMAIL_FROM:nao-responda@vitafortis.com.br}
vita-fortis.frontend-url=${FRONTEND_URL:http://localhost:5001}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
